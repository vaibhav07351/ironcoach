name: Deploy backend

on:
  push:
    branches: [master, main]
    paths:
      - "backend/**"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch:

concurrency:
  group: deploy-backend
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build production .env from secrets
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_ANDROID_CLIENT_ID: ${{ secrets.GOOGLE_ANDROID_CLIENT_ID }}
          GOOGLE_IOS_CLIENT_ID: ${{ secrets.GOOGLE_IOS_CLIENT_ID }}
          GOOGLE_EXPO_CLIENT_ID: ${{ secrets.GOOGLE_EXPO_CLIENT_ID }}
        run: |
          set -euo pipefail
          required=(MONGODB_URI JWT_SECRET CLOUDINARY_CLOUD_NAME CLOUDINARY_API_KEY CLOUDINARY_API_SECRET GOOGLE_CLIENT_ID)
          for key in "${required[@]}"; do
            if [[ -z "${!key}" ]]; then
              echo "Missing required secret: $key" >&2
              exit 1
            fi
          done
          {
            echo "ENV=production"
            echo "PORT=8080"
            echo "MONGODB_URI=${MONGODB_URI}"
            echo "JWT_SECRET=${JWT_SECRET}"
            echo "CLOUDINARY_CLOUD_NAME=${CLOUDINARY_CLOUD_NAME}"
            echo "CLOUDINARY_API_KEY=${CLOUDINARY_API_KEY}"
            echo "CLOUDINARY_API_SECRET=${CLOUDINARY_API_SECRET}"
            echo "GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}"
            echo "GOOGLE_ANDROID_CLIENT_ID=${GOOGLE_ANDROID_CLIENT_ID:-}"
            echo "GOOGLE_IOS_CLIENT_ID=${GOOGLE_IOS_CLIENT_ID:-}"
            echo "GOOGLE_EXPO_CLIENT_ID=${GOOGLE_EXPO_CLIENT_ID:-}"
          } > /tmp/ironcoach.env

      - name: Setup SSH
        env:
          ORACLE_SSH_PRIVATE_KEY: ${{ secrets.ORACLE_SSH_PRIVATE_KEY }}
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
        run: |
          set -euo pipefail
          if [[ -z "${ORACLE_SSH_PRIVATE_KEY}" || -z "${ORACLE_HOST}" ]]; then
            echo "Missing ORACLE_SSH_PRIVATE_KEY or ORACLE_HOST" >&2
            exit 1
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "$ORACLE_SSH_PRIVATE_KEY" > ~/.ssh/oracle.key
          chmod 600 ~/.ssh/oracle.key
          ssh-keyscan -H "$ORACLE_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Sync backend + deploy
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_USER: ${{ secrets.ORACLE_USER }}
        run: |
          set -euo pipefail
          USER="${ORACLE_USER:-ubuntu}"
          HOST="$ORACLE_HOST"
          SSH=(ssh -i ~/.ssh/oracle.key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes)
          RSYNC_SSH="ssh -i ~/.ssh/oracle.key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes"

          "${SSH[@]}" "${USER}@${HOST}" "mkdir -p ~/ironcoach-backend"

          # Ubuntu Minimal has no rsync by default; install once on the VM.
          "${SSH[@]}" "${USER}@${HOST}" \
            'if ! command -v rsync >/dev/null 2>&1; then sudo DEBIAN_FRONTEND=noninteractive apt-get update -qq && sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq rsync; fi'

          rsync -az --delete \
            -e "$RSYNC_SSH" \
            --exclude '.env' \
            --exclude '.env.new' \
            --exclude '.caddyfile.sha256' \
            --exclude '.git' \
            backend/ "${USER}@${HOST}:~/ironcoach-backend/"

          scp -i ~/.ssh/oracle.key -o IdentitiesOnly=yes \
            /tmp/ironcoach.env "${USER}@${HOST}:~/ironcoach-backend/.env.new"

          "${SSH[@]}" "${USER}@${HOST}" \
            "chmod +x ~/ironcoach-backend/deploy/apply.sh && ~/ironcoach-backend/deploy/apply.sh"

      - name: Smoke test
        run: |
          set -euo pipefail
          for i in 1 2 3 4 5; do
            if curl -fsS --max-time 20 https://ironcoach.duckdns.org/ | grep -q "Gym trainer"; then
              echo "smoke: ok"
              exit 0
            fi
            sleep 5
          done
          echo "smoke: failed" >&2
          exit 1
