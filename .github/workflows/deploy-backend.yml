name: Deploy backend

on:
  push:
    branches: [master, main]
    paths:
      - "backend/**"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch:

concurrency:
  group: deploy-backend
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Check formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [[ -n "$unformatted" ]]; then
            echo "Run gofmt on:" >&2
            echo "$unformatted" >&2
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test (unit + Mongo integration)
        env:
          MONGODB_TEST_URI: mongodb://localhost:27017
        run: go test -race -count=1 ./...

  deploy:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build production .env from secrets
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_ANDROID_CLIENT_ID: ${{ secrets.GOOGLE_ANDROID_CLIENT_ID }}
          GOOGLE_IOS_CLIENT_ID: ${{ secrets.GOOGLE_IOS_CLIENT_ID }}
          GOOGLE_EXPO_CLIENT_ID: ${{ secrets.GOOGLE_EXPO_CLIENT_ID }}
          USDA_API_KEY: ${{ secrets.USDA_API_KEY }}
          MIN_APP_VERSION: ${{ vars.MIN_APP_VERSION }}
          LATEST_APP_VERSION: ${{ vars.LATEST_APP_VERSION }}
        run: |
          set -euo pipefail
          required=(MONGODB_URI JWT_SECRET CLOUDINARY_CLOUD_NAME CLOUDINARY_API_KEY CLOUDINARY_API_SECRET GOOGLE_CLIENT_ID)
          for key in "${required[@]}"; do
            if [[ -z "${!key}" ]]; then
              echo "Missing required secret: $key" >&2
              exit 1
            fi
          done
          {
            echo "ENV=production"
            echo "PORT=8080"
            echo "MONGODB_URI=${MONGODB_URI}"
            echo "JWT_SECRET=${JWT_SECRET}"
            echo "CLOUDINARY_CLOUD_NAME=${CLOUDINARY_CLOUD_NAME}"
            echo "CLOUDINARY_API_KEY=${CLOUDINARY_API_KEY}"
            echo "CLOUDINARY_API_SECRET=${CLOUDINARY_API_SECRET}"
            echo "GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}"
            echo "GOOGLE_ANDROID_CLIENT_ID=${GOOGLE_ANDROID_CLIENT_ID:-}"
            echo "GOOGLE_IOS_CLIENT_ID=${GOOGLE_IOS_CLIENT_ID:-}"
            echo "GOOGLE_EXPO_CLIENT_ID=${GOOGLE_EXPO_CLIENT_ID:-}"
            echo "USDA_API_KEY=${USDA_API_KEY:-DEMO_KEY}"
            echo "MIN_APP_VERSION=${MIN_APP_VERSION:-1.0.0}"
            echo "LATEST_APP_VERSION=${LATEST_APP_VERSION:-1.0.0}"
          } > /tmp/ironcoach.env

      - name: Setup SSH
        env:
          ORACLE_SSH_PRIVATE_KEY: ${{ secrets.ORACLE_SSH_PRIVATE_KEY }}
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_KNOWN_HOSTS: ${{ secrets.ORACLE_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          if [[ -z "${ORACLE_SSH_PRIVATE_KEY}" || -z "${ORACLE_HOST}" ]]; then
            echo "Missing ORACLE_SSH_PRIVATE_KEY or ORACLE_HOST" >&2
            exit 1
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "$ORACLE_SSH_PRIVATE_KEY" > ~/.ssh/oracle.key
          chmod 600 ~/.ssh/oracle.key
          # Pin the VM host key via the ORACLE_KNOWN_HOSTS secret (output of
          # `ssh-keyscan -H <host>` captured once from a trusted network). Falling back to a live
          # scan trusts whatever answers, so it only stays as a temporary fallback.
          if [[ -n "${ORACLE_KNOWN_HOSTS:-}" ]]; then
            printf '%s\n' "$ORACLE_KNOWN_HOSTS" >> ~/.ssh/known_hosts
          else
            echo "::warning::ORACLE_KNOWN_HOSTS secret not set; trusting a live ssh-keyscan"
            ssh-keyscan -H "$ORACLE_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          fi

      - name: Sync backend + deploy
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_USER: ${{ secrets.ORACLE_USER }}
        run: |
          set -euo pipefail
          USER="${ORACLE_USER:-ubuntu}"
          HOST="$ORACLE_HOST"
          SSH=(ssh -i ~/.ssh/oracle.key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes)
          RSYNC_SSH="ssh -i ~/.ssh/oracle.key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes"

          "${SSH[@]}" "${USER}@${HOST}" "mkdir -p ~/ironcoach-backend"

          # Ubuntu Minimal has no rsync by default; install once on the VM.
          "${SSH[@]}" "${USER}@${HOST}" \
            'if ! command -v rsync >/dev/null 2>&1; then sudo DEBIAN_FRONTEND=noninteractive apt-get update -qq && sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq rsync; fi'

          rsync -az --delete \
            -e "$RSYNC_SSH" \
            --exclude '.env' \
            --exclude '.env.new' \
            --exclude '.caddyfile.sha256' \
            --exclude '.git' \
            --exclude 'bin/' \
            --exclude '*.exe' \
            backend/ "${USER}@${HOST}:~/ironcoach-backend/"

          scp -i ~/.ssh/oracle.key -o IdentitiesOnly=yes \
            /tmp/ironcoach.env "${USER}@${HOST}:~/ironcoach-backend/.env.new"

          "${SSH[@]}" "${USER}@${HOST}" \
            "chmod +x ~/ironcoach-backend/deploy/apply.sh && ~/ironcoach-backend/deploy/apply.sh"

      - name: Smoke test
        env:
          API: https://ironcoach.duckdns.org
          # Must match CORS_ALLOWED_ORIGINS on the server (its default).
          WEB_ORIGIN: https://ironcoach.expo.app
        run: |
          set -euo pipefail
          healthy=0
          for i in 1 2 3 4 5; do
            if curl -fsS --max-time 20 "$API/healthz" | grep -q '"ok"'; then
              healthy=1
              break
            fi
            sleep 5
          done
          if [[ "$healthy" -ne 1 ]]; then
            echo "smoke: /healthz never reported ok" >&2
            exit 1
          fi

          # /healthz alone can stay "ok" while every real route 404s; check the routes too.
          root_status="$(curl -sS --max-time 20 -o /dev/null -w '%{http_code}' "$API/")"
          if [[ "$root_status" != "200" ]]; then
            echo "smoke: GET / returned $root_status, routes are not being served" >&2
            exit 1
          fi

          # The web app's sign-in starts with a CORS preflight; without the allow-origin header
          # the browser blocks it and users see "No connection".
          allow_origin="$(curl -sS --max-time 20 -o /dev/null -D - -X OPTIONS "$API/auth/google" \
            -H "Origin: $WEB_ORIGIN" \
            -H "Access-Control-Request-Method: POST" \
            -H "Access-Control-Request-Headers: content-type" \
            | tr -d '\r' | awk -F': ' 'tolower($1)=="access-control-allow-origin" {print $2}')"
          if [[ "$allow_origin" != "$WEB_ORIGIN" ]]; then
            echo "smoke: sign-in preflight from $WEB_ORIGIN not allowed (got '${allow_origin}')" >&2
            exit 1
          fi

          echo "smoke: ok (health, routes, web sign-in CORS)"
