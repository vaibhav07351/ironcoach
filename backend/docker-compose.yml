services:
  api:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      ENV: production
      GIN_MODE: release
      PORT: "8080"
    expose:
      - "8080"
    networks:
      - ironcoach

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
    networks:
      - ironcoach

networks:
  ironcoach:

volumes:
  caddy_data:
  caddy_config:
